<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhagavad Gita — A Daily Reading</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕉️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17110c;
    --bg-vignette: radial-gradient(ellipse at 50% -10%, #2a1d13 0%, #17110c 55%);
    --paper: #241a12;
    --paper-2: #2c2015;
    --border: rgba(201,161,90,0.22);
    --border-strong: rgba(201,161,90,0.4);
    --gold: #cd9f52;
    --gold-bright: #e6bd72;
    --cream: #ecdfc7;
    --muted: #a99274;
    --muted-2: #8a765a;
    --shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-vignette), var(--bg);
    background-attachment: fixed;
    color: var(--cream);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height:100vh;
    padding: 32px 16px 80px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  header.top{ text-align:center; margin-bottom: 28px; }
  header.top .om{ font-size: 1.6rem; color: var(--gold); opacity:.85; letter-spacing: .3em; }
  header.top h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600; font-size: 2.6rem; letter-spacing:.02em;
    margin: 6px 0 2px; color: var(--gold-bright);
    text-shadow: 0 2px 20px rgba(205,159,82,0.15);
  }
  header.top .sub{ color: var(--muted); font-style: italic; font-size: 1rem; }

  .divider{
    display:flex; align-items:center; gap:14px; margin: 22px 0; color: var(--muted-2);
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); }
  .divider span{ font-size:.9rem; }

  /* ---- progress ---- */
  .progress-card{
    background: var(--paper); border:1px solid var(--border); border-radius:14px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .progress-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .progress-top .label{ color: var(--muted); font-size:.88rem; letter-spacing:.03em; text-transform:uppercase; }
  .progress-top .figure{ color: var(--gold-bright); font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.25rem; }
  .bar-track{
    position:relative; height:10px; border-radius:6px; background: rgba(0,0,0,0.35);
    margin: 12px 0 8px; overflow:hidden; border:1px solid var(--border);
  }
  .bar-fill{
    height:100%; border-radius:6px;
    background: linear-gradient(90deg, #9c7a3f, var(--gold-bright));
    box-shadow: 0 0 12px rgba(230,189,114,0.55);
    transition: width .5s ease;
  }
  .chapter-ticks{ display:flex; gap:2px; margin-top:10px; }
  .chapter-ticks .tick{
    flex:1; height:5px; border-radius:2px; background: rgba(255,255,255,0.06);
    cursor:pointer; position:relative;
  }
  .chapter-ticks .tick.done{ background: rgba(205,159,82,0.55); }
  .chapter-ticks .tick.current{ background: var(--gold-bright); box-shadow: 0 0 6px rgba(230,189,114,0.8); }
  .chapter-ticks .tick:hover::after{
    content: attr(data-label); position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background:#000; color:var(--cream); padding:3px 7px; border-radius:5px; font-size:.72rem;
    white-space:nowrap; border:1px solid var(--border); pointer-events:none; z-index: 5;
  }

  /* ---- passage card ---- */
  .passage-card{
    background: var(--paper); border:1px solid var(--border); border-radius:16px;
    padding: 26px 26px 22px; margin-top: 22px; box-shadow: var(--shadow);
  }
  .passage-header{ text-align:center; margin-bottom: 6px; }
  .passage-header .chapter-eyebrow{ color: var(--muted); font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; }
  .passage-header h2{
    font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.7rem; margin:4px 0 2px; color: var(--gold-bright);
  }
  .passage-header .devanagari-title{ font-family:'Noto Serif Devanagari',serif; color: var(--muted); font-size:1.1rem; }

  .verse-block{
    padding: 22px 18px; margin: 0 -18px; border-top: 1px solid var(--border);
    border-radius: 10px; scroll-margin-top: 24px; transition: background .3s ease;
  }
  .verse-block:first-of-type{ border-top:none; }
  .verse-block.is-past{ opacity: .5; }
  .verse-block.is-current{
    background: rgba(205,159,82,0.09);
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .verse-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .verse-tag{
    display:inline-block; font-size:.78rem; color:#17110c; background: var(--gold);
    padding:2px 9px; border-radius:20px; font-family:'Crimson Pro',serif; font-weight:600; letter-spacing:.02em;
  }
  .verse-block.is-past .verse-tag{ background: var(--muted-2); }
  .current-badge{
    font-size:.76rem; color: var(--gold-bright); font-style: italic; letter-spacing:.02em;
  }
  .mark-here-btn{
    background:none; border:1px solid var(--border-strong); color: var(--muted);
    font-family:'Crimson Pro',serif; font-size:.76rem; padding: 3px 10px; border-radius:20px;
    cursor:pointer; margin-left:auto; opacity:.7; transition: all .15s ease;
  }
  .mark-here-btn:hover{ opacity:1; color: var(--gold-bright); border-color: var(--gold); }
  .speaker{ color: var(--muted-2); font-size:.82rem; font-style:italic; margin-bottom:8px; }
  .sanskrit{
    font-family:'Cormorant Garamond', serif; font-style: italic; font-weight:600;
    font-size:1.5rem; line-height:1.7;
    color: var(--gold-bright); white-space:pre-line; margin-bottom:14px;
  }
  .translit{
    font-style:italic; color: var(--muted); font-size:.95rem; line-height:1.7;
    white-space:pre-line; margin-bottom:14px;
  }
  .translation{ font-size:1.12rem; line-height:1.75; color: var(--cream); margin-bottom: 12px; }
  .commentary-toggle{
    background:none; border:none; color: var(--gold); font-family:'Crimson Pro',serif;
    font-size:.88rem; cursor:pointer; padding:0; text-decoration: underline dotted;
    text-underline-offset: 3px; opacity: .85;
  }
  .commentary-toggle:hover{ opacity:1; }
  .commentary{
    margin-top:12px; padding: 14px 16px; background: var(--paper-2); border-left: 3px solid var(--border-strong);
    border-radius: 0 8px 8px 0; color: var(--muted); font-size: .98rem; line-height:1.7;
    display:none;
  }
  .commentary.open{ display:block; }
  .commentary .author{ color: var(--gold); font-style: italic; font-size:.85rem; display:block; margin-bottom:6px; }

  /* ---- controls ---- */
  .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top: 22px; }
  button.primary, button.ghost{
    font-family:'Crimson Pro', serif; font-size:1rem; padding: 11px 22px; border-radius: 30px;
    cursor:pointer; letter-spacing:.02em; transition: all .15s ease;
  }
  button.primary{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#20160b; border:none;
    font-weight:600; box-shadow: 0 4px 16px rgba(205,159,82,0.3);
  }
  button.primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 20px rgba(205,159,82,0.45); }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  button.ghost{ background:transparent; color: var(--muted); border:1px solid var(--border-strong); }
  button.ghost:hover{ color: var(--cream); border-color: var(--gold); }

  .completed-banner{
    text-align:center; padding:16px; margin-top:14px; border:1px dashed var(--border-strong);
    border-radius:12px; color: var(--gold-bright); font-family:'Cormorant Garamond',serif; font-size:1.2rem;
  }

  /* ---- chapter nav ---- */
  .chapter-nav{
    margin-top:22px; background: var(--paper); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
  }
  .chapter-nav select{
    background: var(--paper-2); color: var(--cream); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-family:'Crimson Pro',serif; font-size:.95rem; max-width: 60vw;
  }

  footer{ text-align:center; margin-top:40px; color: var(--muted-2); font-size:.8rem; }
  footer a{ color: var(--muted); }

  .loading{ text-align:center; color: var(--muted); padding: 60px 0; font-style:italic; }

  /* ---- floating action buttons ---- */
  .fab-stack{
    position: fixed; right: 18px; bottom: 22px; display:flex; flex-direction:column; gap:12px; z-index: 50;
  }
  .fab{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border-strong);
    background: var(--paper-2); color: var(--gold-bright); font-size:1.35rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55); transition: transform .15s ease, box-shadow .15s ease;
  }
  .fab:hover{ transform: translateY(-2px) scale(1.04); box-shadow: 0 8px 26px rgba(0,0,0,0.65); }
  .fab.gold{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#20160b; border:none;
  }

  /* ---- table of contents ---- */
  .toc-backdrop{
    position: fixed; inset:0; background: rgba(10,7,4,0.75); backdrop-filter: blur(2px);
    z-index: 60; display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width: 620px){
    .toc-backdrop{ align-items:center; }
  }
  .toc-panel{
    background: var(--paper); border:1px solid var(--border-strong); box-shadow: var(--shadow);
    width:100%; max-width:560px; max-height:82vh; overflow-y:auto;
    border-radius: 18px 18px 0 0; padding: 8px 0 20px;
  }
  @media (min-width: 620px){
    .toc-panel{ border-radius:18px; margin: 20px; }
  }
  .toc-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 14px 20px 12px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background: var(--paper);
  }
  .toc-head h3{ font-family:'Cormorant Garamond',serif; color: var(--gold-bright); font-size:1.3rem; margin:0; font-weight:600; }
  .toc-close{
    background:none; border:1px solid var(--border-strong); color: var(--muted); border-radius:50%;
    width:30px; height:30px; cursor:pointer; font-size:1rem; line-height:1;
  }
  .toc-close:hover{ color: var(--cream); border-color: var(--gold); }
  .toc-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--border); color: var(--cream);
    padding: 13px 20px; cursor:pointer; font-family:'Crimson Pro',serif; font-size:1rem;
  }
  .toc-row:hover{ background: rgba(205,159,82,0.08); }
  .toc-row .num{
    font-family:'Cormorant Garamond',serif; font-weight:600; color: var(--muted); font-size:1.15rem; width:22px; flex-shrink:0;
  }
  .toc-row .titles{ flex:1; min-width:0; }
  .toc-row .titles .en{ color: var(--cream); }
  .toc-row .titles .sa{ color: var(--muted-2); font-size:.82rem; }
  .toc-row .badge{
    font-size:.7rem; color: var(--gold-bright); border:1px solid var(--border-strong); border-radius:20px;
    padding:2px 8px; flex-shrink:0; white-space:nowrap;
  }
  .toc-row.is-bookmarked .num{ color: var(--gold-bright); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="om">श्रीमद् भगवद्गीता</div>
    <h1>Bhagavad Gita</h1>
    <div class="sub">a verse a day, from the field of Kurukṣetra</div>
  </header>

  <div id="app">
    <div class="loading">Opening the book…</div>
  </div>

  <footer>
    Swami Sivananda's translation &amp; commentary, sourced from <a href="https://www.dlshq.org/download/bhagavad-gita/" target="_blank" rel="noopener">The Divine Life Society</a>.
    Your place in the book is saved only on this device.
  </footer>

</div>

<script>
(function(){
  "use strict";

  const CHAPTER_COUNT = 18;
  const BOOKMARK_KEY = "gita-bookmark";

  let chapters = null;      // { [chapterNum]: chapterData }
  let chapterOffsets = null; // { [chapterNum]: verses before this chapter }
  let totalVerses = 0;
  let viewChapter = null;    // which chapter is currently displayed (defaults to the bookmark's)
  let scrollToBookmark = false; // one-shot flag: scroll the bookmarked verse into view after this render
  let tocOpen = false;        // whether the table-of-contents overlay is showing

  const app = document.getElementById("app");

  function loadBookmark(){
    let bm;
    try{
      bm = JSON.parse(localStorage.getItem(BOOKMARK_KEY));
    }catch(e){ bm = null; }
    if(!bm || typeof bm.chapter !== "number" || typeof bm.verse !== "number"){
      bm = { chapter: 1, verse: 1 };
    }
    return bm;
  }

  function saveBookmark(bm){
    localStorage.setItem(BOOKMARK_KEY, JSON.stringify({ chapter: bm.chapter, verse: bm.verse }));
  }

  function chapterMeta(ch){ return chapters[ch]; }
  function verseData(ch, v){
    const c = chapters[ch];
    if(!c) return null;
    return c.verses[v-1] || null;
  }

  // Global 1-based index of a (chapter, verse) across the whole Gita.
  function globalIndex(ch, v){
    return chapterOffsets[ch] + v;
  }

  function lastVerseRef(){
    return { chapter: CHAPTER_COUNT, verse: chapters[CHAPTER_COUNT].verse_count };
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderProgress(ch, v){
    const idx = Math.min(totalVerses, globalIndex(ch, v));
    const pct = Math.min(100, (idx-1) / totalVerses * 100);
    const meta = chapterMeta(ch);
    let ticks = "";
    for(let c=1;c<=CHAPTER_COUNT;c++){
      let cls = "tick";
      if(c < ch) cls += " done";
      else if(c === ch) cls += " current";
      const cm = chapterMeta(c);
      ticks += `<div class="${cls}" data-label="Ch.${c} — ${escapeHtml(cm.title_translation)}" onclick="GitaApp.goToChapter(${c})"></div>`;
    }
    return `
      <div class="progress-card">
        <div class="progress-top">
          <span class="label">Your place in the Gītā</span>
          <span class="figure">${idx} / ${totalVerses} verses</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="chapter-ticks">${ticks}</div>
      </div>
    `;
  }

  function verseBlockHtml(vd, bm, isLastOfBook){
    const commentaryId = `c-${vd.chapter}-${vd.verse}`;
    const idx = globalIndex(vd.chapter, vd.verse);
    const bmIdx = globalIndex(bm.chapter, bm.verse);
    const isCurrent = idx === bmIdx;
    const isPast = idx < bmIdx;
    const stateClass = isCurrent ? "is-current" : (isPast ? "is-past" : "is-future");

    let marker;
    if(isCurrent){
      marker = `<span class="current-badge">📍 you're here</span>`;
    }else if(isLastOfBook){
      marker = `<button class="mark-here-btn" onclick="GitaApp.markHere(${vd.chapter}, ${vd.verse}, true)">mark as finished</button>`;
    }else{
      marker = `<button class="mark-here-btn" onclick="GitaApp.markHere(${vd.chapter}, ${vd.verse})">mark as here</button>`;
    }

    return `
      <div class="verse-block ${stateClass}" id="verse-${vd.chapter}-${vd.verse}">
        <div class="verse-head">
          <span class="verse-tag">${vd.chapter}.${vd.verse_label || vd.verse}</span>
          ${marker}
        </div>
        ${vd.speaker ? `<div class="speaker">${escapeHtml(vd.speaker)} said —</div>` : ""}
        <div class="sanskrit">${escapeHtml(vd.sanskrit)}</div>
        ${vd.transliteration ? `<div class="translit">${escapeHtml(vd.transliteration)}</div>` : ""}
        <div class="translation">${escapeHtml(vd.translation)}</div>
        ${vd.commentary ? `
          <button class="commentary-toggle" onclick="GitaApp.toggleCommentary('${commentaryId}')">read commentary ▾</button>
          <div class="commentary" id="${commentaryId}">
            ${vd.commentary_author ? `<span class="author">— ${escapeHtml(vd.commentary_author)}</span>` : ""}
            ${escapeHtml(vd.commentary)}
          </div>
        ` : ""}
      </div>
    `;
  }

  function render(){
    const bm = loadBookmark();
    const meta = chapterMeta(viewChapter);
    const last = lastVerseRef();
    const onCurrentChapter = viewChapter === bm.chapter;

    let html = renderProgress(bm.chapter, bm.verse);

    html += `
      <div class="passage-card">
        <div class="passage-header">
          <div class="chapter-eyebrow">Chapter ${viewChapter} of ${CHAPTER_COUNT}${onCurrentChapter ? " · your current chapter" : ""}</div>
          <h2>${escapeHtml(meta.title_translation)}</h2>
          ${meta.title_sanskrit ? `<div class="devanagari-title">${escapeHtml(meta.title_sanskrit)}</div>` : ""}
        </div>
    `;

    html += meta.verses.map(vd =>
      verseBlockHtml(vd, bm, vd.chapter === last.chapter && vd.verse === last.verse)
    ).join("");

    if(bm.chapter === CHAPTER_COUNT && bm.verse > last.verse && viewChapter === CHAPTER_COUNT){
      html += `
        <div class="completed-banner">🙏 You have read the entire Bhagavad Gītā.<br>Begin again whenever you're ready.
          <div class="controls" style="margin-top:12px;">
            <button class="ghost" onclick="GitaApp.restart()">Start over</button>
          </div>
        </div>
      `;
    }

    html += `</div>`; // passage-card

    html += chapterNavHtml(bm);

    html += fabStackHtml();
    if(tocOpen) html += tocOverlayHtml(bm);

    app.innerHTML = html;

    if(scrollToBookmark){
      scrollToBookmark = false;
      const target = document.getElementById(`verse-${bm.chapter}-${Math.min(bm.verse, last.verse)}`);
      if(target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function chapterNavHtml(bm){
    let chOptions = "";
    for(let c=1;c<=CHAPTER_COUNT;c++){
      chOptions += `<option value="${c}" ${c===viewChapter?"selected":""}>Ch ${c} — ${escapeHtml(chapterMeta(c).title_translation)}</option>`;
    }
    return `
      <div class="chapter-nav">
        <button class="ghost" ${viewChapter<=1?"disabled":""} onclick="GitaApp.goToChapter(${viewChapter-1})">◂ prev chapter</button>
        <select onchange="GitaApp.goToChapter(this.value)">${chOptions}</select>
        <button class="ghost" ${viewChapter>=CHAPTER_COUNT?"disabled":""} onclick="GitaApp.goToChapter(${viewChapter+1})">next chapter ▸</button>
        ${viewChapter!==bm.chapter ? `<button class="primary" onclick="GitaApp.jumpToBookmark()">jump to my place</button>` : ""}
      </div>
    `;
  }

  function fabStackHtml(){
    return `
      <div class="fab-stack">
        <button class="fab" title="Table of contents" onclick="GitaApp.openToc()">☰</button>
        <button class="fab gold" title="Jump to my place" onclick="GitaApp.jumpToBookmark()">📍</button>
      </div>
    `;
  }

  function tocOverlayHtml(bm){
    let rows = "";
    for(let c=1;c<=CHAPTER_COUNT;c++){
      const cm = chapterMeta(c);
      const isBookmarked = c === bm.chapter;
      rows += `
        <button class="toc-row ${isBookmarked ? "is-bookmarked" : ""}" onclick="GitaApp.goToChapterFromToc(${c})">
          <span class="num">${c}</span>
          <span class="titles">
            <div class="en">${escapeHtml(cm.title_translation)}</div>
            ${cm.title_sanskrit ? `<div class="sa">${escapeHtml(cm.title_sanskrit)}</div>` : ""}
          </span>
          ${isBookmarked ? `<span class="badge">📍 ${bm.chapter}.${bm.verse}</span>` : ""}
        </button>
      `;
    }
    return `
      <div class="toc-backdrop" onclick="if(event.target===this) GitaApp.closeToc()">
        <div class="toc-panel">
          <div class="toc-head">
            <h3>Chapters</h3>
            <button class="toc-close" onclick="GitaApp.closeToc()">✕</button>
          </div>
          ${rows}
        </div>
      </div>
    `;
  }

  const GitaApp = {
    toggleCommentary(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle("open");
      const btn = el.previousElementSibling;
      if(btn && btn.classList.contains("commentary-toggle")){
        btn.textContent = el.classList.contains("open") ? "hide commentary ▴" : "read commentary ▾";
      }
    },
    // Sets the bookmark to exactly this verse — "I'm reading here."
    // asFinished pins one verse past the very end of the book, so the
    // completion banner shows (same sentinel the init clamp understands).
    markHere(ch, v, asFinished){
      const bm = { chapter: ch, verse: asFinished ? v + 1 : v };
      saveBookmark(bm);
      viewChapter = bm.chapter <= CHAPTER_COUNT ? bm.chapter : ch;
      render();
    },
    restart(){
      saveBookmark({ chapter: 1, verse: 1 });
      viewChapter = 1;
      scrollToBookmark = true;
      render();
    },
    goToChapter(ch){
      viewChapter = Math.max(1, Math.min(CHAPTER_COUNT, parseInt(ch, 10)));
      render();
      window.scrollTo({ top: document.querySelector(".passage-card").offsetTop - 16, behavior: "smooth" });
    },
    jumpToBookmark(){
      const bm = loadBookmark();
      viewChapter = bm.chapter;
      tocOpen = false;
      scrollToBookmark = true;
      render();
    },
    openToc(){
      tocOpen = true;
      render();
    },
    closeToc(){
      tocOpen = false;
      render();
    },
    goToChapterFromToc(ch){
      tocOpen = false;
      GitaApp.goToChapter(ch);
    }
  };
  window.GitaApp = GitaApp;

  async function init(){
    try{
      const fetches = [];
      for(let c=1;c<=CHAPTER_COUNT;c++){
        const n = String(c).padStart(2,"0");
        fetches.push(fetch(`data/chapter-${n}.json`).then(r=>{
          if(!r.ok) throw new Error(`chapter ${c}: HTTP ${r.status}`);
          return r.json();
        }));
      }
      const results = await Promise.all(fetches);
      chapters = {};
      chapterOffsets = {};
      let offset = 0;
      results.forEach((data, i) => {
        const c = i+1;
        chapters[c] = data;
        chapterOffsets[c] = offset;
        offset += data.verse_count;
      });
      totalVerses = offset;

      // Clamp a stale/out-of-range bookmark (e.g. from a shorter dataset) into range.
      const bm = loadBookmark();
      if(bm.chapter > CHAPTER_COUNT || !chapters[bm.chapter]){
        bm.chapter = 1; bm.verse = 1; saveBookmark(bm);
      }else if(bm.verse > chapters[bm.chapter].verse_count + 1){
        bm.verse = chapters[bm.chapter].verse_count + 1; saveBookmark(bm);
      }

      viewChapter = bm.chapter;
      scrollToBookmark = true;
      render();
    }catch(err){
      app.innerHTML = `<div class="loading">Could not load the text (${escapeHtml(err.message)}). If you're viewing this file directly (file://), serve it over a local web server instead — e.g. <code>python3 -m http.server</code>.</div>`;
      console.error(err);
    }
  }

  init();
})();
</script>
